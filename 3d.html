<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.166.1/build/three.module.js';

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x050506);
scene.fog=new THREE.FogExp2(0x090707,.027);
const camera=new THREE.PerspectiveCamera(47,innerWidth/innerHeight,.1,90);
let target=new THREE.Vector3(0,1.45,-.35),radius=9.2,theta=0,phi=1.22,viewIndex=0,bright=false;

const hemi=new THREE.HemisphereLight(0x8a777c,0x100b0b,.65);scene.add(hemi);

function material(color,roughness=.8,metalness=.08,emissive=0,emissiveIntensity=0){return new THREE.MeshStandardMaterial({color,roughness,metalness,emissive,emissiveIntensity})}
const iron=material(0x282224,.72,.65),darkIron=material(0x100f11,.7,.58),rust=material(0x492c29,.95,.08),edgePaint=material(0x332523,.88,.1),rubber=material(0x101012,.98,0),brass=material(0x756044,.45,.62),redPaint=material(0x702b2a,.72,.15),screenMat=material(0x111a16,.35,.2,0x1d392b,.3),chalk=material(0xc8bca0,.96,0,0x2b251d,.05);

function cable(points,r,mat){const curve=new THREE.CatmullRomCurve3(points.map(p=>new THREE.Vector3(...p)));const mesh=new THREE.Mesh(new THREE.TubeGeometry(curve,48,r,7,false),mat);mesh.castShadow=true;scene.add(mesh);return mesh}
function grimeTexture(base,specks,seed=17){const c=document.createElement('canvas');c.width=c.height=512;const ctx=c.getContext('2d');ctx.fillStyle=base;ctx.fillRect(0,0,512,512);let s=seed;const rand=()=>{s=(s*1664525+1013904223)>>>0;return s/4294967296};for(let i=0;i<17000;i++){const x=rand()*512,y=rand()*512,r=.25+rand()*2.6;ctx.globalAlpha=.06+rand()*.28;ctx.fillStyle=specks[Math.floor(rand()*specks.length)];ctx.fillRect(x,y,r*(1+rand()*2),r)}for(let i=0;i<240;i++){ctx.globalAlpha=.04+rand()*.1;ctx.strokeStyle=specks[Math.floor(rand()*specks.length)];ctx.lineWidth=.4+rand()*1.5;ctx.beginPath();let x=rand()*512,y=rand()*512;ctx.moveTo(x,y);ctx.lineTo(x+(rand()-.5)*65,y+(rand()-.5)*34);ctx.stroke()}ctx.globalAlpha=1;const tex=new THREE.CanvasTexture(c);tex.colorSpace=THREE.SRGBColorSpace;tex.wrapS=tex.wrapT=THREE.RepeatWrapping;tex.anisotropy=4;return tex}
const tableTexture=grimeTexture('#484637',['#77745a','#282e2a','#8b7962','#43332f','#b0a18a','#312c2b'],29);
tableTexture.repeat.set(2.4,1.5);

for(let i=0;i<13;i++){const x=-5.8+i*.96;box(scene,.035,6.0,.05,iron,x,2.8,-5.22)}

for(let x of [-5.5,-3.7,-1.9,0,1.9,3.7,5.5]){box(scene,.16,.16,10.5,iron,x,5.8,-1.1)}
for(let i=0;i<7;i++){const x=-5.2+i*1.7;cable([[x,5.75,-4.8],[x+.25,4.9,-4.1],[x+.7,4.1,-3.6],[x+1.05,4.8,-2.6],[x+1.2,5.65,-1.9]],.027,i%2?rubber:darkIron)}

// Thick worn perimeter rails
for(const x of [-4.02,4.02])box(scene,.15,.13,5.42,rusted,x,1.25,.25);
for(const z of [-2.46,2.96])box(scene,8.05,.13,.15,rusted,0,1.25,z);
// Flat chalk markings with slight irregular handmade imperfection
const circleMaterial=material(0xc8bd9f,.96,0,0x252016,.04);

function chalkRect(cx,cz,w,d){const y=1.272;box(scene,w,.009,.027,chalk,cx,y,cz-d/2);box(scene,w,.009,.027,chalk,cx,y,cz+d/2);box(scene,.027,.009,d,chalk,cx-w/2,y,cz);box(scene,.027,.009,d,chalk,cx+w/2,y,cz)}

for(let i=0;i<=8;i++)box(scene,.018,.012,.42,chalk,rackX-rackW/2+i*rackW/8,1.3,rackZ);

// Two small shell props, with muted red casings
function shell(x,z,rot,live){const g=new THREE.Group();g.position.set(x,1.34,z);g.rotation.y=rot;scene.add(g);cylinder(g,.065,.065,.24,material(live?0x762b29:0x242427,.5,.35),0,0,0,18);cylinder(g,.067,.067,.032,brass,0,-.121,0,18);g.rotation.x=Math.PI/2}
shell(-.65,.0,-.3,true);shell(-.38,.25,.4,false);

// Primitive analog electronics: speaker, receiver, displays, chunky switches and glowing LEDs
function screen(parent,w,h,x,y,z,color=0x9cbb91){const cv=document.createElement('canvas');cv.width=256;cv.height=96;const cx=cv.getContext('2d');cx.fillStyle='#07100c';cx.fillRect(0,0,256,96);cx.strokeStyle='#52715a';cx.lineWidth=2;for(let i=0;i<12;i++){cx.beginPath();cx.moveTo(i*23,10);cx.lineTo(i*23,86);cx.stroke()}cx.strokeStyle='#a9c99a';cx.beginPath();cx.moveTo(6,60);for(let i=1;i<240;i+=8)cx.lineTo(i,24+Math.random()*46);cx.stroke();const tex=new THREE.CanvasTexture(cv);tex.colorSpace=THREE.SRGBColorSpace;const m=new THREE.Mesh(new THREE.PlaneGeometry(w,h),new THREE.MeshBasicMaterial({map:tex}));m.position.set(x,y,z);parent.add(m);return m}
function knob(parent,x,y,z,r=.075){cylinder(parent,r,r,.065,brass,x,y,z,12).rotation.x=Math.PI/2;box(parent,.018,.075,.02,darkIron,x,y+.018,z+.043)}
function consoleBox(x,y,z,w,h,d,rot=0,type='panel'){const g=new THREE.Group();g.position.set(x,y,z);g.rotation.y=rot;scene.add(g);box(g,w,h,d,rusted,0,0,0);box(g,w*.94,h*.82,.035,darkIron,0,0,d/2+.018);if(type==='speaker'){const ring=new THREE.Mesh(new THREE.TorusGeometry(h*.29,.045,8,32),brass);ring.position.set(-w*.20,-h*.04,d/2+.055);g.add(ring);sphere(g,-w*.20,-h*.04,d/2+.04,h*.25,h*.25,.045,rubber,24);box(g,w*.42,h*.13,.035,iron,w*.22,h*.27,d/2+.045);for(let i=0;i<4;i++)box(g,.045,h*.45,.02,brass,w*.1+i*.1,-h*.24,d/2+.05)}else{box(g,w*.66,h*.28,.028,screenMat,0,h*.2,d/2+.05);screen(g,w*.6,h*.23,0,h*.2,d/2+.069);for(let i=0;i<5;i++)knob(g,-w*.35+i*w*.17,-h*.18,d/2+.055,.055);for(let i=0;i<4;i++){const l=sphere(g,-w*.34+i*w*.2,h*.0,d/2+.06,.025,.025,.018,material(i%2?0x8a2928:0x9bb78e,.3,.1,i%2?0x861a18:0x31573c,2),10)}}return g}
consoleBox(-4.72,1.85,-.9,1.32,1.35,.38,.28,'speaker');

// A second bulky rack close to the far right edge
const rack= new THREE.Group();rack.position.set(3.95,1.58,.05);rack.rotation.y=-.47;scene.add(rack);
box(rack,1.7,.58,.7,iron,0,0,0);box(rack,1.56,.39,.05,darkIron,0,.02,.38);box(rack,1.3,.08,.035,screenMat,0,.12,.415);
for(let i=0;i<6;i++){cylinder(rack,.075,.075,.05,brass,-.58+i*.23,-.08,.43,12).rotation.x=Math.PI/2;sphere(rack,-.58+i*.23,.1,.435,.027,.027,.015,material(i%2?0xb33c30:0xa0b98c,.25,.05,i%2?0x77120e:0x315e3c,2),10)}
for(let i=0;i<7;i++){const tube=cylinder(rack,.095,.095,.36,material(0x51413a,.55,.45),-.65+i*.215,.43,.04,12);tube.rotation.z=Math.PI/2}

// Ceiling-mounted battered floodlights and brackets, aimed toward the table
function floodlight(x,z,rot){const g=new THREE.Group();g.position.set(x,4.48,z);g.rotation.z=rot;scene.add(g);box(g,.95,.22,.72,iron,0,0,0);box(g,.78,.07,.52,brass,0,-.15,0);box(g,.65,.025,.4,material(0x99806a,.5,.2,0xf2a26a,.9),0,-.2,0);for(const s of [-1,1])box(g,.08,.35,.56,edgePaint,s*.48,-.08,0);const l=new THREE.SpotLight(0xffc49a,34,12,Math.PI/5,.8,1.6);l.position.set(x,4.2,z);l.target.position.set(x*.45,0,z+.8);scene.add(l,l.target);box(scene,.13,.9,.13,iron,x,5.0,z)}

// A distant, partially obscured human-like dealer face in the darkness, not a floating cartoon mask
const head=new THREE.Group();head.position.set(0,3.03,-4.28);scene.add(head);
const faceMat=material(0x443630,.97,.01),shadowMat=material(0x100d0d,.95,0),pupilMat=material(0x130d0d,.35,.05),teethMat=material(0x968875,.9,.02);

sphere(head,-.17,.09,.342,.044,.06,.025,pupilMat,12);sphere(head,.17,.09,.342,.044,.06,.025,pupilMat,12);

// Tiny scattered lights and airborne dust
for(let i=0;i<18;i++){const x=-5.4+(i%9)*1.35,z=-4.8+Math.floor(i/9)*.48;const led=sphere(scene,x,4.62,z,.025,.018,.018,i%3===0?redPaint:screenMat,8)}
const dustCount=420,positions=new Float32Array(dustCount*3);let randSeed=773;function rand(){randSeed=(randSeed*1664525+1013904223)>>>0;return randSeed/4294967296}

// Touch/mouse camera. Starting view is the seated player's view across the table.
function updateCamera(){const sin=Math.sin(phi);camera.position.set(target.x+radius*sin*Math.sin(theta),target.y+radius*Math.cos(phi),target.z+radius*sin*Math.cos(theta));camera.lookAt(target)}

updateCamera();
let dragging=false,lastX=0,lastY=0;
const canvas=renderer.domElement;
canvas.addEventListener('pointerdown',e=>{dragging=true;lastX=e.clientX;lastY=e.clientY;canvas.setPointerCapture(e.pointerId)});
canvas.addEventListener('pointermove',e=>{if(!dragging)return;theta-=(e.clientX-lastX)*.005;phi=clamp(phi+(e.clientY-lastY)*.004,.5,1.55);lastX=e.clientX;lastY=e.clientY;updateCamera()});
canvas.addEventListener('pointerup',()=>dragging=false);canvas.addEventListener('pointercancel',()=>dragging=false);
canvas.addEventListener('wheel',e=>{radius=clamp(radius+e.deltaY*.008,5.4,14);updateCamera()},{passive:true});
let pinchDistance=0;
canvas.addEventListener('touchmove',e=>{if(e.touches.length===2){e.preventDefault();const a=e.touches[0],b=e.touches[1],d=Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY);if(pinchDistance)radius=clamp(radius+(pinchDistance-d)*.016,5.4,14);pinchDistance=d;updateCamera()}},{passive:false});

document.querySelector('#view').onclick=()=>{viewIndex=(viewIndex+1)%3;const presets=[[0,1.22,9.2,new THREE.Vector3(0,1.45,-.35)],[0,.94,6.5,new THREE.Vector3(0,1.3,.15)],[Math.PI,.98,9.8,new THREE.Vector3(0,1.7,-.65)]];[theta,phi,radius,target]=presets[viewIndex];target=target.clone();document.querySelector('#mode').textContent=['PLAYER VIEW','TABLE CLOSE-UP','ROOM REVERSE'][viewIndex];updateCamera()};
document.querySelector('#lights').onclick=()=>{bright=!bright;ceilingLight.intensity=bright?145:100;redLight.intensity=bright?38:25;dirtyLight.intensity=bright?28:18;renderer.toneMappingExposure=bright?1.13:.96;document.querySelector('#lights').textContent='LIGHTS: '+(bright?'BRIGHT':'DIM')};
document.querySelector('#reset').onclick=()=>{theta=0;phi=1.22;radius=9.2;target.set(0,1.45,-.35);viewIndex=0;document.querySelector('#mode').textContent='PLAYER VIEW';updateCamera()};
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setPixelRatio(Math.min(devicePixelRatio,1.65));renderer.setSize(innerWidth,innerHeight)});
const clock=new THREE.Clock();
function animate(){requestAnimationFrame(animate);const t=clock.getElapsedTime();redLight.intensity=(bright?38:25)+Math.sin(t*1.4)*2;dirtyLight.intensity=(bright?28:18)+Math.sin(t*.9+1)*1.5;head.position.y=3.03+Math.sin(t*.8)*.025;head.rotation.y=Math.sin(t*.3)*.03;dust.rotation.y=t*.003;renderer.render(scene,camera)}
animate();
</script>
</body>
</html>
