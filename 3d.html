<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#08090d">
<title>LAST ROUND — 3D ARENA</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600;700&family=Noto+Sans+JP:wght@400;600;800&display=swap');
:root{color-scheme:dark;--red:#e94d49;--muted:#a7a4aa}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#08090d;color:#eee;font-family:'Noto Sans JP',sans-serif}canvas{display:block;position:fixed;inset:0;touch-action:none}.vignette{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 30%,#030407a8 100%),linear-gradient(180deg,#08090d99,transparent 28%,transparent 65%,#08090ddd)}.top{position:fixed;top:0;left:0;right:0;padding:18px 22px;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none}.logo{font:700 12px 'IBM Plex Mono',monospace;letter-spacing:.2em}.logo b{color:var(--red)}.tag{color:#b8b0ae;font:10px 'IBM Plex Mono',monospace;letter-spacing:.16em;margin-top:7px}.status{border:1px solid #8a3d3b88;background:#160d10b8;padding:8px 11px;color:#ffaaa1;font:10px 'IBM Plex Mono',monospace;letter-spacing:.12em}.bottom{position:fixed;bottom:0;left:0;right:0;padding:20px 22px 24px;display:flex;align-items:end;justify-content:space-between;gap:20px;background:linear-gradient(0deg,#050609e8,transparent);pointer-events:none}.headline{font-size:clamp(24px,4vw,44px);font-weight:800;letter-spacing:-.06em;line-height:1.08;text-shadow:0 4px 24px #000}.headline span{color:var(--red)}.sub{font:10px 'IBM Plex Mono',monospace;letter-spacing:.14em;color:#aaa;margin-top:10px}.controls{display:flex;gap:8px;pointer-events:auto;flex-wrap:wrap;justify-content:flex-end}button,a{font:11px 'IBM Plex Mono',monospace;letter-spacing:.04em;color:#eee;text-decoration:none;background:#17181de8;border:1px solid #77707888;padding:11px 13px;cursor:pointer}button:hover,a:hover{border-color:#e94d49;background:#2a171a}.hint{position:fixed;top:92px;left:22px;color:#c5bfc0;font:10px 'IBM Plex Mono',monospace;letter-spacing:.1em;line-height:1.8;pointer-events:none}.crosshair{position:fixed;left:50%;top:50%;width:18px;height:18px;transform:translate(-50%,-50%);opacity:.3;pointer-events:none}.crosshair:before,.crosshair:after{content:'';position:absolute;background:#ffaaa1}.crosshair:before{width:18px;height:1px;top:9px}.crosshair:after{height:18px;width:1px;left:9px}@media(max-width:650px){.top{padding:14px}.hint{left:14px;top:78px;font-size:9px}.bottom{padding:16px 14px 20px;display:block}.headline{font-size:30px}.controls{justify-content:flex-start;margin-top:14px}.controls button,.controls a{padding:10px}.status{font-size:9px}.sub{font-size:9px}}
</style>
</head>
<body>
<div class="vignette"></div>
<header class="top"><div><div class="logo">CHATGPT<span style="color:#eee">/</span><b>ROULETTE</b></div><div class="tag">LAST ROUND · 3D SCENE STUDY</div></div><div class="status" id="status">SCENE ONLINE</div></header>
<div class="hint">DRAG / SWIPE : ORBIT CAMERA<br>PINCH / WHEEL : ZOOM<br>VIEW MODE : <span id="viewName">CINEMATIC</span></div><div class="crosshair"></div>
<footer class="bottom"><div><div class="headline">ONE TABLE.<br><span>NO SAFE CHOICES.</span></div><div class="sub">A 3D PLAYABLE-SPACE PROTOTYPE · ORIGINAL FAN CONCEPT</div></div><div class="controls"><button id="view">CHANGE VIEW</button><button id="light">LIGHTS: LOW</button><button id="reset">RESET CAMERA</button><a href="./">BACK TO GAME ↗</a></div></footer>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.166.1/build/three.module.js';
const scene=new THREE.Scene();scene.background=new THREE.Color(0x08090d);scene.fog=new THREE.FogExp2(0x08090d,.035);
const camera=new THREE.PerspectiveCamera(42,innerWidth/innerHeight,.1,100);let target=new THREE.Vector3(0,1.15,0),radius=9.8,theta=.22,phi=1.12;
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.15;document.body.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0x9aa8c8,0x1b1012,1.6));
const key=new THREE.SpotLight(0xffd4ae,120,30,Math.PI/5,.65,1.6);key.position.set(1,8,5);key.target.position.set(0,0,0);key.castShadow=true;scene.add(key,key.target);
const red=new THREE.PointLight(0xff263c,35,12);red.position.set(-4,2.7,-1);scene.add(red);const blue=new THREE.PointLight(0x426bba,23,10);blue.position.set(4,3,-2);scene.add(blue);
const floorMat=new THREE.MeshStandardMaterial({color:0x111217,roughness:.82,metalness:.25});const floor=new THREE.Mesh(new THREE.PlaneGeometry(80,80),floorMat);floor.rotation.x=-Math.PI/2;floor.position.y=-.04;floor.receiveShadow=true;scene.add(floor);
const grid=new THREE.GridHelper(50,50,0x38252b,0x202128);grid.position.y=-.025;grid.material.transparent=true;grid.material.opacity=.25;scene.add(grid);
function mat(color,rough=.5,metal=.2,emissive=0,ei=0){return new THREE.MeshStandardMaterial({color,roughness:rough,metalness:metal,emissive,emissiveIntensity:ei})}
const dark=mat(0x16171c,.38,.65),black=mat(0x08090c,.3,.45),edge=mat(0x5b5152,.32,.8),wood=mat(0x321d1e,.3,.35),redMat=mat(0x8d252b,.3,.45,0x5a080e,.45),brass=mat(0xb08b52,.25,.78),cloth=mat(0x171419,.96,.02),skin=mat(0x29272b,.75,.05);
function box(parent,w,h,d,material,x,y,z,bevel=0){const g=new THREE.BoxGeometry(w,h,d);const m=new THREE.Mesh(g,material);m.position.set(x,y,z);m.castShadow=true;m.receiveShadow=true;parent.add(m);return m}
function cylinder(parent,rt,rb,h,material,x,y,z,seg=24){const m=new THREE.Mesh(new THREE.CylinderGeometry(rt,rb,h,seg),material);m.position.set(x,y,z);m.castShadow=true;m.receiveShadow=true;parent.add(m);return m}
function sphere(parent,x,y,z,sx,sy,sz,material){const m=new THREE.Mesh(new THREE.SphereGeometry(1,24,16),material);m.position.set(x,y,z);m.scale.set(sx,sy,sz);m.castShadow=true;parent.add(m);return m}
// Industrial room
for(let i=0;i<8;i++){const x=-7+i*2;box(scene,.08,5,.12,edge,x,2.45,-5.5);box(scene,1.65,.035,.05,redMat,x+.8,4.5,-5.45)}
box(scene,15,.18,.18,edge,0,4.7,-5.5);box(scene,15,.18,.18,edge,0,0.15,-5.5);
for(let i=0;i<5;i++){const lamp=box(scene,1.2,.035,.25,mat(0x8b3335,.3,.2,0xff2525,2),-4+i*2,4.6,-3.7);const l=new THREE.PointLight(0xff3333,2,5);l.position.set(-4+i*2,4.3,-3.6);scene.add(l)}
// Worn rectangular game table: chalk-marked tennis-table surface with a circular metal insert
const tableTop=box(scene,6.9,.24,4.5,mat(0x34312a,.94,.08),0,1.17,0);
box(scene,7.02,.09,4.62,edge,0,1.02,0);
box(scene,6.82,.035,4.42,mat(0x4b4638,.96,.02),0,1.305,0);
// scratched green-brown playing felt and chalk grid
box(scene,6.62,.018,4.22,mat(0x494638,.98,.01),0,1.33,0);
const chalk=mat(0xbab29a,.95,.01,0x28251e,.1);
for(let x=-3;x<=3;x+=1){box(scene,.018,.012,4.05,chalk,x,1.345,0)}
for(let z=-2;z<=2;z+=1){box(scene,6.45,.012,.018,chalk,0,1.346,z)}
// Large flat chalk circle painted onto the rectangular tabletop — not a raised circular platform
const circleLineMat=mat(0xbdb49a,.96,.01,0x28251e,.08);
const paintedCircle=new THREE.Mesh(new THREE.TorusGeometry(1.72,.018,8,96),circleLineMat);
paintedCircle.rotation.x=Math.PI/2;
paintedCircle.position.set(0,1.365,0);
paintedCircle.receiveShadow=true;
scene.add(paintedCircle);
// A simple center line crosses the table, as in the reference image
box(scene,6.42,.012,.022,chalk,0,1.356,0);
// Table legs and reinforced industrial frame
for(const x of [-2.8,2.8])for(const z of [-1.7,1.7]){box(scene,.18,1.0,.18,dark,x,.52,z);box(scene,.28,.09,.28,black,x,.08,z)}
box(scene,5.9,.12,.12,edge,0,.45,-1.65);box(scene,5.9,.12,.12,edge,0,.45,1.65);
// Clearly marked shell rack on the player's side
for(let i=0;i<8;i++){const x=-2.7+i*.77;box(scene,.68,.035,.48,black,x,1.37,1.72);box(scene,.59,.012,.37,mat(0x25241f,.8,.05),x,1.394,1.72)}
// Dealer/player labels painted onto the worn surface
function labelTexture(text,color){const canvas=document.createElement('canvas');canvas.width=512;canvas.height=128;const ctx=canvas.getContext('2d');ctx.clearRect(0,0,512,128);ctx.fillStyle=color;ctx.font='bold 56px monospace';ctx.textAlign='center';ctx.fillText(text,256,78);const tex=new THREE.CanvasTexture(canvas);tex.colorSpace=THREE.SRGBColorSpace;const m=new THREE.MeshBasicMaterial({map:tex,transparent:true,depthWrite:false});const plane=new THREE.Mesh(new THREE.PlaneGeometry(1.8,.45),m);plane.rotation.x=-Math.PI/2;return plane}
const dealerLabel=labelTexture('DEALER','#c9c0a6');dealerLabel.position.set(0,1.355,-1.55);scene.add(dealerLabel);
const youLabel=labelTexture('YOU','#c9c0a6');youLabel.position.set(0,1.355,1.55);scene.add(youLabel);
// Shells laid on table
function shell(x,z,rot,live){const g=new THREE.Group();g.position.set(x,1.43,z);g.rotation.z=rot;scene.add(g);cylinder(g,.075,.075,.22,live?redMat:mat(0x292b31,.28,.7),0,0,0,20);cylinder(g,.077,.077,.035,brass,0,-.105,0,20);cylinder(g,.05,.05,.025,live?mat(0xc44b3d,.3,.4):edge,0,.12,0,20);g.rotation.x=Math.PI/2;return g}
shell(-.45,-.15,-.4,true);shell(-.15,.08,.5,false);shell(.28,-.12,.7,true);shell(.48,.18,-.3,false);
// A heavy, fictional prop weapon: stylized geometry, not a functional model
const weapon=new THREE.Group();weapon.position.set(.05,1.53,.48);weapon.rotation.set(.04,-.32,-.07);scene.add(weapon);
box(weapon,.22,.17,.78,dark,0,0,0);box(weapon,.19,.13,.38,wood,0,-.11,.4);box(weapon,.12,.09,.72,black,0,.03,-.52);cylinder(weapon,.065,.065,.62,edge,0,.02,-.8,20).rotation.x=Math.PI/2;box(weapon,.06,.05,.2,brass,0,.105,-.34);
// silhouette builder
function person(x,z,rot,isDealer){const g=new THREE.Group();g.position.set(x,0,z);g.rotation.y=rot;scene.add(g);const coat=isDealer?mat(0x171014,.95,.02):cloth;const hood=isDealer?mat(0x08070b,.9,.02):black;
cylinder(g,.27,.39,.95,coat,0,1.13,0,20);sphere(g,0,1.84,0,.28,.34,.25,hood);sphere(g,0,1.83,.2,.18,.11,.08,isDealer?redMat:skin);
box(g,.15,.62,.17,coat,-.29,1.16,.05);box(g,.15,.62,.17,coat,.29,1.16,.05);cylinder(g,.12,.12,.63,black,-.14,.34,0,12);cylinder(g,.12,.12,.63,black,.14,.34,0,12);
if(isDealer){sphere(g,0,2.3,0,.34,.06,.3,black);for(let i=-1;i<=1;i++){const eye=sphere(g,i*.09,1.88,.268,.025,.018,.015,redMat);}}
return g}
// Dealer: a hovering, unsettling mask-like head emerging from the darkness beyond the table
const dealer=new THREE.Group();dealer.position.set(0,2.72,-3.05);scene.add(dealer);
const maskMat=mat(0x302722,.92,.02),deep=mat(0x09090b,.65,.05),teeth=mat(0xc1b9a2,.82,.02),eyeGlow=mat(0x8d282a,.25,.1,0x9f141b,1.6);
sphere(dealer,0,0,0,.76,.64,.43,maskMat);
sphere(dealer,-.29,.15,.37,.19,.24,.09,deep);sphere(dealer,.29,.15,.37,.19,.24,.09,deep);
sphere(dealer,-.29,.15,.45,.075,.09,.035,eyeGlow);sphere(dealer,.29,.15,.45,.075,.09,.035,eyeGlow);
sphere(dealer,0,-.25,.39,.42,.18,.08,deep);
for(let i=0;i<9;i++){const tooth=box(dealer,.055,.12,.055,teeth,-.31+i*.078,-.28,.46);tooth.rotation.z=(i-4)*-.035}
for(let i=0;i<8;i++){const tooth=box(dealer,.05,.085,.05,teeth,-.27+i*.078,-.36,.455);tooth.rotation.z=(i-3)*.04}
const neck=box(dealer,.48,.48,.3,deep,0,-.78,0);neck.rotation.z=.04;
// The tabletop circle is a flat painted chalk marking; no raised perimeter hardware.
// Floating dust
const count=280,positions=new Float32Array(count*3);for(let i=0;i<count;i++){positions[i*3]=(Math.random()-.5)*13;positions[i*3+1]=Math.random()*5;positions[i*3+2]=(Math.random()-.5)*11-1}
const dustGeo=new THREE.BufferGeometry();dustGeo.setAttribute('position',new THREE.BufferAttribute(positions,3));const dust=new THREE.Points(dustGeo,new THREE.PointsMaterial({color:0xd9a6a0,size:.022,transparent:true,opacity:.45}));scene.add(dust);
let dragging=false,lastX=0,lastY=0,view=0,bright=false;const el=renderer.domElement;
function updateCamera(){const sin=Math.sin(phi);camera.position.set(target.x+radius*sin*Math.sin(theta),target.y+radius*Math.cos(phi),target.z+radius*sin*Math.cos(theta));camera.lookAt(target)}
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}updateCamera();
el.addEventListener('pointerdown',e=>{dragging=true;lastX=e.clientX;lastY=e.clientY;el.setPointerCapture(e.pointerId)});el.addEventListener('pointermove',e=>{if(!dragging)return;theta-=(e.clientX-lastX)*.006;phi=clamp(phi+(e.clientY-lastY)*.005,.35,1.55);lastX=e.clientX;lastY=e.clientY;updateCamera()});el.addEventListener('pointerup',()=>dragging=false);el.addEventListener('pointercancel',()=>dragging=false);el.addEventListener('wheel',e=>{radius=clamp(radius+e.deltaY*.009,5.3,15);updateCamera()},{passive:true});
let pinch=0;el.addEventListener('touchmove',e=>{if(e.touches.length===2){e.preventDefault();const dx=e.touches[0].clientX-e.touches[1].clientX,dy=e.touches[0].clientY-e.touches[1].clientY,d=Math.hypot(dx,dy);if(pinch)radius=clamp(radius+(pinch-d)*.018,5.3,15);pinch=d;updateCamera()}},{passive:false});el.addEventListener('touchend',()=>pinch=0);
document.querySelector('#view').onclick=()=>{view=(view+1)%3;const presets=[[.22,1.12,9.8,new THREE.Vector3(0,1.15,0)],[0,.82,6.8,new THREE.Vector3(0,1.2,0)],[Math.PI,1.3,10.5,new THREE.Vector3(0,1.1,0)]];[theta,phi,radius,target]=presets[view];target=target.clone();document.querySelector('#viewName').textContent=['CINEMATIC','TABLE CLOSE-UP','DEALER SIDE'][view];updateCamera()};
document.querySelector('#light').onclick=()=>{bright=!bright;key.intensity=bright?190:120;red.intensity=bright?55:35;blue.intensity=bright?35:23;renderer.toneMappingExposure=bright?1.35:1.15;document.querySelector('#light').textContent='LIGHTS: '+(bright?'HIGH':'LOW')};
document.querySelector('#reset').onclick=()=>{theta=.22;phi=1.12;radius=9.8;target.set(0,1.15,0);view=0;document.querySelector('#viewName').textContent='CINEMATIC';updateCamera()};
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));renderer.setSize(innerWidth,innerHeight)});
const clock=new THREE.Clock();function animate(){requestAnimationFrame(animate);const t=clock.getElapsedTime();red.intensity=(bright?55:35)+Math.sin(t*1.8)*4;blue.intensity=(bright?35:23)+Math.sin(t*1.1+1)*3;dust.rotation.y=t*.012;dealer.position.y=2.72+Math.sin(t*1.2+1)*.045;dealer.rotation.y=Math.sin(t*.35)*.055;renderer.render(scene,camera)}animate();
</script>
</body></html>
